<svg width="100%" height="100%" viewBox="0 0 850 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="aboutGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E2032" stroke-width="1.2" opacity="0.5"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F1017"/>
      <stop offset="100%" stop-color="#141522"/>
    </linearGradient>

    <!-- Card Colors -->
    <linearGradient id="slabPurple" x1="0" y1="0" x2="700" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="slabPink" x1="0" y1="0" x2="720" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="slabYellow" x1="0" y1="0" x2="680" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <linearGradient id="slabTan" x1="0" y1="0" x2="650" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A89F57"/>
      <stop offset="100%" stop-color="#8C823E"/>
    </linearGradient>

    <filter id="slabShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Outfit:wght@700;800&amp;display=swap');
      
      .slab-title {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 19px;
      }
      .slab-desc {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 500;
        font-size: 13px;
      }
      .section-header {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 24px;
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="460" rx="20" fill="url(#bgGrad)"/>
  <rect width="850" height="460" rx="20" fill="url(#aboutGrid)"/>

  <!-- Section Header -->
  <g transform="translate(50, 40)">
    <text class="section-header" x="0" y="0">✦ ABOUT ME &amp; CORE FOCUS</text>
    <rect x="0" y="10" width="310" height="3" fill="#8B5CF6" rx="1.5"/>
  </g>

  <!-- Floating Stars -->
  <path d="M780 40 L783 50 L793 53 L783 56 L780 66 L777 56 L767 53 L777 50 Z" fill="#FACC15"/>
  <path d="M45 420 L47 427 L54 429 L47 431 L45 438 L43 431 L36 429 L43 427 Z" fill="#EC4899"/>
  <path d="M800 390 L803 398 L811 400 L803 402 L800 410 L797 402 L789 400 L797 398 Z" fill="#34D399"/>

  <!-- SLAB 1: Full Stack Development -->
  <g transform="translate(70, 75) rotate(-1)" filter="url(#slabShadow)">
    <rect width="700" height="78" rx="20" fill="url(#slabPurple)"/>
    <rect x="6" y="6" width="688" height="66" rx="14" fill="none" stroke="#A78BFA" stroke-dasharray="6,4" opacity="0.6"/>
    <text x="28" y="32" class="slab-title" fill="#FFFFFF">🌐 Full Stack Web Development</text>
    <text x="28" y="55" class="slab-desc" fill="#F3E8FF">
      <tspan x="28" dy="0">Specialized in React, TypeScript, Node.js, Express, and MongoDB.</tspan>
      <tspan x="28" dy="17">I craft scalable backend APIs &amp; responsive modern frontends.</tspan>
    </text>
    <g transform="translate(660, 10)">
      <circle cx="20" cy="20" r="16" fill="#FACC15"/>
      <text x="20" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#18181B" text-anchor="middle">01</text>
    </g>
  </g>

  <!-- SLAB 2: AI Applications & Geospatial -->
  <g transform="translate(60, 168) rotate(1)" filter="url(#slabShadow)">
    <rect width="720" height="78" rx="20" fill="url(#slabPink)"/>
    <rect x="6" y="6" width="708" height="66" rx="14" fill="none" stroke="#F472B6" stroke-dasharray="6,4" opacity="0.6"/>
    <text x="28" y="32" class="slab-title" fill="#FFFFFF">🤖 AI Apps &amp; Geospatial Engineering</text>
    <text x="28" y="55" class="slab-desc" fill="#FFE4E6">
      <tspan x="28" dy="0">Creator of Aura AI, SnapScan &amp; Drone Route Planner using Gemini/Groq APIs,</tspan>
      <tspan x="28" dy="17">Mapbox GL JS, React Leaflet, &amp; graph A* pathfinding algorithms.</tspan>
    </text>
    <g transform="translate(680, 10)">
      <circle cx="20" cy="20" r="16" fill="#FFFFFF"/>
      <text x="20" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#BE185D" text-anchor="middle">02</text>
    </g>
  </g>

  <!-- SLAB 3: UI/UX & Motion Design -->
  <g transform="translate(75, 261) rotate(-0.5)" filter="url(#slabShadow)">
    <rect width="690" height="78" rx="20" fill="url(#slabYellow)"/>
    <rect x="6" y="6" width="678" height="66" rx="14" fill="none" stroke="#FEF08A" stroke-dasharray="6,4" opacity="0.7"/>
    <text x="28" y="32" class="slab-title" fill="#1E1B4B">🎨 UI/UX &amp; Interactive Web Motion</text>
    <text x="28" y="55" class="slab-desc" fill="#312E81">
      <tspan x="28" dy="0">Figma prototyping, Tailwind CSS, component design systems,</tspan>
      <tspan x="28" dy="17">micro-animations, and creative frontend user interfaces.</tspan>
    </text>
    <g transform="translate(645, -5) rotate(15)">
      <circle cx="22" cy="22" r="22" fill="#34D399"/>
      <text x="22" y="22" font-family="'Outfit', sans-serif" font-weight="800" font-size="8" fill="#064E3B" text-anchor="middle">DESIGN</text>
      <text x="22" y="30" font-family="'Outfit', sans-serif" font-weight="800" font-size="8" fill="#064E3B" text-anchor="middle">DRIVEN ✦</text>
    </g>
  </g>

  <!-- SLAB 4: IoT & Hardware Systems -->
  <g transform="translate(85, 354) rotate(0.8)" filter="url(#slabShadow)">
    <rect width="660" height="78" rx="20" fill="url(#slabTan)"/>
    <rect x="6" y="6" width="648" height="66" rx="14" fill="none" stroke="#D97706" stroke-dasharray="6,4" opacity="0.5"/>
    <text x="28" y="32" class="slab-title" fill="#FFFFFF">📹 IoT &amp; Hardware Prototyping</text>
    <text x="28" y="55" class="slab-desc" fill="#FEF3C7">
      <tspan x="28" dy="0">Built Smart Door Dash Cam with ESP32-S3, ESP32-CAM,</tspan>
      <tspan x="28" dy="17">ultrasonic &amp; PIR motion sensors, servos, and Blynk IoT integration.</tspan>
    </text>
    <g transform="translate(620, 10)">
      <circle cx="20" cy="20" r="16" fill="#7C5CFC"/>
      <text x="20" y="24" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">04</text>
    </g>
  </g>
</svg>
